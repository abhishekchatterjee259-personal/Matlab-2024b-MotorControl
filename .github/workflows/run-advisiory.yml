name: MATLAB CI

on:
  push:
    branches: [main, Dev, Motor_Control]
  pull_request:
    branches: [main, Dev, Motor_Control]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up MATLAB with toolboxes
      # Use the latest supported version of MATLAB Actions
      - name: Set up MATLAB with toolboxes
        uses: matlab-actions/setup-matlab@v2
        with:
          products: |
            Simulink
            Simulink Check
            Simulink Test
            Embedded Coder

      # Step 3: Verify MATLAB installation
      - name: Verify MATLAB installation
        uses: matlab-actions/run-command@v2
        with:
          command: |
            disp('MATLAB CI pipeline is working!');

      # Step 4: Load MATLAB project
      - name: Load MATLAB project
        uses: matlab-actions/run-command@v2
        with:
          command: |
            proj = matlab.project.loadProject(fullfile(pwd,'Matlab.prj'));
            disp(['Loaded project: ', proj.Name]);

      # Step 5: Run Process Advisor checks (if available)
      - name: Run Process Advisor checks (if available)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            proj = matlab.project.loadProject(fullfile(pwd,'Matlab.prj'));
            if exist('padv.ProcessModel','class')
                pm = padv.ProcessModel();
                processmodel(pm);
                results = pm.runAll();
                disp('Process Advisor checks completed.');
                disp(results);
                resultsDir = fullfile(pwd,'PA_Results');
                if ~exist(resultsDir,'dir')
                    mkdir(resultsDir);
                end
                disp(['Saving results to: ', resultsDir]);
                save(fullfile(resultsDir,'ci_results.mat'),'results');
            else
                warning('Process Advisor not available in this environment. Skipping checks.');
                resultsDir = fullfile(pwd,'PA_Results');
                if ~exist(resultsDir,'dir')
                    mkdir(resultsDir);
                end
                fid = fopen(fullfile(resultsDir,'dummy.txt'),'w');
                fprintf(fid,'Process Advisor not available in this run.');
                fclose(fid);
            end

      # Step 6: Upload Process Advisor results
      - name: Upload Process Advisor results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PA_Results
          path: PA_Results
