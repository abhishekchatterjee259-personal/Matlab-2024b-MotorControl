name: Simple MATLAB CI

on:
  push:
    branches: [main, Dev, yamlMODIFICATION]
  pull_request:
    branches: [main, Dev, yamlMODIFICATION]

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b

      - name: Verify MATLAB installation
        uses: matlab-actions/run-command@v2
        with:
          command: |
            disp('MATLAB CI basic test successful.')
            version
            ver
      - name: Load Project
        uses: matlab-actions/run-command@v2
        with:
          command: |
            proj=matlab.project.loadProject(fullfile(pwd,'MotorControl.prj'));
            proj=currentProject
            disp(['LoadedProject-->',proj.Name]);
